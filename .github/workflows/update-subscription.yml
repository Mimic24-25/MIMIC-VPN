name: Update MIMIC VPN subscription

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/**"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: mimic-vpn-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Xray-core for real VPN tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip curl
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip \
            -o "$RUNNER_TEMP/xray.zip"
          mkdir -p "$RUNNER_TEMP/xray"
          unzip -q "$RUNNER_TEMP/xray.zip" -d "$RUNNER_TEMP/xray"
          sudo install -m 0755 "$RUNNER_TEMP/xray/xray" /usr/local/bin/xray
          xray version

      - name: Build combined subscription
        env:
          XRAY_BIN: /usr/local/bin/xray

          V2HUB_SUB_URL: ${{ secrets.V2HUB_SUB_URL }}
        run: python3 .github/scripts/build_subscription.py

      - name: Publish subscription safely
        shell: bash
        run: |
          set -euo pipefail

          # Keep this run's freshly generated list outside the worktree.
          cp mimic-vpn.txt "$RUNNER_TEMP/mimic-vpn.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Refresh main before every push attempt. This avoids non-fast-forward
          # failures when an earlier queued run has already published a list.
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/mimic-vpn.txt" mimic-vpn.txt
            git add mimic-vpn.txt

            if git diff --cached --quiet; then
              echo "Subscription is already up to date."
              exit 0
            fi

            git commit -m "Update MIMIC VPN subscription"
            if git push origin HEAD:main; then
              echo "Subscription published successfully."
              exit 0
            fi

            echo "Branch moved during push; retrying against latest main."
            sleep 2
          done

          echo "Could not publish after 5 attempts."
          exit 1
